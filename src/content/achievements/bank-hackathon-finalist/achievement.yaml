title: "Top 10 Finalist - Bank Indonesia Hackathon 2024"
date: 2024-03-01
summary: "Joined the Bank Indonesia Hackathon as a first-time competitor and helped Team Bravo Six bring BitTrack into the Top 10 from 2,200+ participants and 450+ proposals, contributing to the React frontend, FastAPI integration, market research, and product strategy."
highlights:
  - "Helped shape BitTrack's business case as a Bitcoin wallet trust-scoring product for reducing fraud, scam, Ponzi scheme, and money-laundering risk before users send funds."
  - "Built and refined the React frontend wallet-demo experience, showing how users would receive real-time warnings when a destination address had risky transaction history."
  - "Helped integrate the React frontend with the Python FastAPI backend so the demo could communicate BitTrack's trust-score flow clearly."
  - "Researched market context and crypto-risk data, including public sources such as Statista, to justify why Bitcoin scam and money-laundering prevention matters for safer digital finance."
  - "Created the jury presentation deck in Canva with structured business storytelling, visual layout, and icon-driven slides to explain the problem, solution, demo, and market opportunity."
  - "Supported the product narrative, positioning BitTrack as an API-as-a-Service opportunity for brokers and wallet providers."
  - "Reached the finals, earned a booth at Jakarta Convention Center, and connected with builders, mentors, and fintech innovators."
